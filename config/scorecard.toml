# Scorecard settings for notebooks/deliverable.ipynb, section 12 (spec docs/superpowers/specs/2026-11-10-scorecard-design.md).
# Change a value here and rerun the notebook; no weight, role or mapping below is repeated in the code.
# Another file can be used for a run with the SCORECARD_CONFIG environment variable (relative to the repo root).

[scoring]
unresolved_credit = 0.5             # fraction of a pass for a unit with only unresolved failures

# Domain weights for the main score: equal (spec §5.2). A rule over a few records and one over every trade row count
# the same.
[weights.domains]
Accounts = 1
Securities = 1
Trades = 1
"Corporate actions" = 1
Positions = 1
Prices = 1
NAV = 1

# Sensitivity variant 1 (spec §5.5): domains closer to the NAV weigh more. These values are a team assumption, set on
# 10 Nov before looking at any score.
[weights.nav_proximity]
Accounts = 1
Securities = 1
Trades = 1
"Corporate actions" = 1
Positions = 2
Prices = 2
NAV = 3

# Optional weight of a rule inside its domain (spec §5.2); a rule not listed here weighs 1.
[weights.rules]

[sensitivity]
worst_n = 50                         # accounts: how many of the N worst stay in the worst N under each variant (§5.5)

# Domain -> owner, as scripts/framework.json ("checks") names them (spec §5.1); the notebook asserts they are equal.
[owners]
Accounts = "Account onboarding lead"
Securities = "Security master lead"
Trades = "Trade operations lead"
"Corporate actions" = "Corporate actions lead"
Positions = "Reconciliation lead"
Prices = "Pricing lead"
NAV = "Fund accounting lead"

# Tests (spec §5.2): each counts one unit kind over one population. `rule` is compared with the register's rule after
# dropping a trailing " (added)". Unit kinds: transaction row, transaction_id, position row, key, security, feed-day,
# action, ledger row, rate row, price row. `weight` is the test's weight inside its rule (equal to start).
[tests."ACC.exists"]
domain = "Accounts"
rule = "ACC_NOT_OPEN_ON_TRADE_DATE"
unit = "transaction row"
weight = 1

[tests."ACC.open"]
domain = "Accounts"
rule = "ACC_NOT_OPEN_ON_TRADE_DATE"
unit = "transaction row"
weight = 1

[tests."ACC.positions"]
domain = "Accounts"
rule = "POS_KEYS_MASTERED"
unit = "position row"
weight = 1

[tests."SEC.exists"]
domain = "Securities"
rule = "TXN_SECURITY_NOT_MASTERED"
unit = "transaction row"
weight = 1

[tests."SEC.cusip"]
domain = "Securities"
rule = "TXN_SECURITY_NOT_MASTERED"
unit = "transaction row"
weight = 1

[tests."SEC.currency"]
domain = "Securities"
rule = "TXN_SECURITY_NOT_MASTERED"
unit = "transaction row"
weight = 1

[tests."SEC.positions"]
domain = "Securities"
rule = "POS_KEYS_MASTERED"
unit = "position row"
weight = 1

[tests."TRD.copies"]
domain = "Trades"
rule = "TXN_DUPLICATE"
unit = "transaction row"
weight = 1

[tests."TRD.economic"]
domain = "Trades"
rule = "TXN_DUPLICATE"
unit = "transaction_id"
weight = 1

[tests."TRD.fields"]
domain = "Trades"
rule = "TXN_FIELDS_VALID"
unit = "transaction row"
weight = 1

[tests."TRD.links"]
domain = "Trades"
rule = "TXN_CORRECTION_LINK"
unit = "transaction row"
weight = 1

[tests."TRD.reversals"]
domain = "Trades"
rule = "TXN_ONE_REVERSAL_PER_ORIGINAL"
unit = "transaction row"
weight = 1

[tests."TRD.timestamps"]
domain = "Trades"
rule = "TXN_TIMESTAMPS_IN_ORDER"
unit = "transaction_id"
weight = 1

[tests."TRD.latency"]
domain = "Trades"
rule = "TXN_TIMESTAMPS_IN_ORDER"
unit = "feed-day"
weight = 1

[tests."TRD.cutoff"]
domain = "Trades"
rule = "TXN_AFTER_CUTOFF"
unit = "transaction_id"
weight = 1

[tests."CA.terms"]
domain = "Corporate actions"
rule = "CA_TERMS_COMPLETE"
unit = "action"
weight = 1

[tests."POS.rebuild"]
domain = "Positions"
rule = "POS_REBUILD_MATCHES"
unit = "key"
weight = 1

[tests."POS.custodian"]
domain = "Positions"
rule = "POS_CUSTODIAN_BREAK"
unit = "key"
weight = 1

[tests."PRC.coverage"]
domain = "Prices"
rule = "PRC_QUOTE_ELIGIBLE"
unit = "position row"
weight = 1

[tests."PRC.freshness"]
domain = "Prices"
rule = "PRC_QUOTE_ELIGIBLE"
unit = "security"
weight = 1

[tests."PRC.vendors"]
domain = "Prices"
rule = "PRC_VENDOR_DISPERSION"
