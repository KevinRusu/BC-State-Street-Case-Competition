# Register line -> test and role (spec §5.3). Every register line must match exactly one entry: by exact `finding`, or
# else by the longest matching `prefix` (for the break-class lines, whose names depend on the data). An unmatched line,
# or two entries matching one line equally well, stops the run. Roles:
#   fail           its units fail the test (in the confirmed-only score only if the line is confirmed);
#   cleared        its units pass;
#   not evaluable  its units leave the test's evaluable count (lower coverage, never the score);
#   beside         reported next to the test, no effect on it;
#   summary        a total whose breakdown lines are also mapped; not scored, so the breakdown decides. It names its
#                  breakdown lines (spec §5.3): `covers` = lines whose units all belong to this summary, `shares` = lines
#                  that may also hold units of another summary. The run checks the summary's units against the union of
#                  the breakdown lines' units (marked or not evaluable): relation "equals" = every summary unit is in a
#                  breakdown line and every `covers` unit is in the summary; "subset" = every summary unit is in one.
# On fail and cleared lines the register's evidence status decides: a line whose status is cleared counts as
# cleared, any other status as fail (spec §8).

# --- Accounts (spec §5.10; K4-K8)
[[lines]]
finding = "Trade on an account_id missing from accounts"
test = "ACC.exists"
role = "fail"

[[lines]]
finding = "Trade before the account's open_date"
test = "ACC.open"
role = "fail"

[[lines]]
finding = "Trade after the account's close_date"
test = "ACC.open"
role = "fail"

[[lines]]
finding = "Trade on an account closed later, open on the trade date"
test = "ACC.open"
role = "cleared"

[[lines]]
finding = "Trade on an account whose status contradicts its close_date"
test = "ACC.open"
role = "not evaluable"               # the dates cannot be trusted while status and close_date disagree

[[lines]]
finding = "Position on an account_id missing from accounts"
test = "ACC.positions"
role = "fail"

