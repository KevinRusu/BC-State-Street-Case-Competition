# Indicators (spec §5.6; brief §5 and App. B): the catalog written to outputs/02_indicators.csv, in this order. `status`
# is computed or proposed; a proposed indicator names its missing inputs in `inputs_needed`. `gaming` names one way an
# operations team could make the number look better without fixing anything, and what in the numbers would show it.
# `threshold_value` is the number each series row is judged against (the text says how). `unit` is the unit of the headline
# `value` in 02_indicators.csv (I2's week rows in the series are ratios; the threshold text says so).
[indicators.I1]
name = "Unmastered security rate"
type = "Leading"
status = "computed"
calculation = "100 x trade rows whose security_id is blank or missing from securities / trade rows judged, per trade date (the security-existence test of TXN_SECURITY_NOT_MASTERED, section 9c). Copies of one transaction_id with different results are not evaluable."
unit = "% of trade rows"
refresh = "daily"
threshold = "any occurrence (brief App. B): a trade date with one such trade is a breach"
threshold_value = 0.0
owner = "Security master lead"
decision = "Set up the missing security, or hold the trade, before it settles into a position"
predicts = "Positions that cannot be priced, and a NAV gap at the next valuation (brief App. B)"
gaming = "Creating a placeholder security with no cusip or currency brings the rate to 0 without real master data; the not-evaluable counts of the cusip and currency checks and the held securities with no eligible quote rise."
inputs_needed = ""

[indicators.I2]
name = "Booking latency"
type = "Leading"
status = "computed"
calculation = "Median of booked - received minutes per feed and day, over the records that can be judged (02_timeliness.csv, processing_latency rows). Week over week: per feed, a calendar week's median over its records (never a median of daily medians) divided by the previous week's."
unit = "minutes"
refresh = "daily; weekly for the week-over-week change"
threshold = "a daily median above the feed's limit in config/reconciliation.toml [timeliness.processing_latency_limit_minutes] (brief App. B: above four hours), or a week's median at least doubling_factor times the previous week's (brief App. B: a doubling week over week)"
doubling_factor = 2.0                # the feed limits are not repeated here: they stay in config/reconciliation.toml
owner = "Trade operations lead"
decision = "Escalate the feed (staff it, fix it or reroute it) before its records start missing the valuation cutoff"
predicts = "Records missing the valuation cutoff, producing a stale NAV (brief App. B)"
gaming = "Booking the backlog in one burst just before cutoff keeps the median low; the p95 and maximum minutes in 02_timeliness.csv and the count booked after cutoff rise."
inputs_needed = ""

[indicators.I3]
name = "Corporate action readiness"
type = "Leading"
status = "computed"
calculation = "100 x actions supported / actions assessed, per effective date (section 9 verdicts, 02_ca_readiness.csv). Supported: the terms its type needs are present and its securities are mastered. Eligibility is not proof the action was applied. An action whose effective date does not read is not evaluable."
unit = "% of actions"
refresh = "by effective date"
threshold = "below 100% once the effective date is reached (brief App. B), judged at the snapshot"
threshold_value = 100.0
owner = "Corporate actions lead"
decision = "Complete the terms or set up the security before the effective date; hold the position adjustment until then"
predicts = "Position adjustments that may be blocked, seen as breaks on the source and target securities; confirming the adjustment needs an event ledger (brief App. B)"
gaming = "Typing a placeholder ratio or cash rate (e.g. 1) makes an action supported without real terms; position breaks on its source and target securities after the effective date would show it."
inputs_needed = ""

[indicators.I4]
name = "Fresh, agreed price coverage"
type = "Leading"
status = "computed"
calculation = "100 x securities held on the snapshot whose chosen quote on the price date is eligible and fresh and whose vendors agree (no scale or spread flag) / those securities judged, for every readable price date (section 8b's PRC_QUOTE_ELIGIBLE rule and section 8's PRC_VENDOR_DISPERSION test, per date). Not evaluable, unless another part fails: a single vendor or two quote currencies on the date (nothing to compare), and section 8b's not-evaluable cases."
unit = "% of held securities"
refresh = "daily"
threshold = "below KPI 5's target, at least 99% (scripts/framework.json)"
threshold_value = 99.0               # equals KPI 5's target "at least 99%" in scripts/framework.json
owner = "Pricing lead"
decision = "Challenge the vendors, or price from another source, before the NAV is struck"
predicts = "Holdings valued on a missing, stale or disputed price at the next NAV"
gaming = "Taking quotes from one vendor only turns flagged securities into single-vendor ones, which are not evaluable rather than failing; the not_evaluable count rises and the denominator shrinks."
inputs_needed = ""

[indicators.I5]
name = "Position break count"
type = "Lagging"
status = "computed"
calculation = "Keys (account, security, as-of date) in positions or comparison_positions whose quantities differ beyond the tolerance, or that sit on one side only, at the snapshot (section 3). One-sided keys are reported apart; the match rate, matched / (matched + differing), is beside it. Keys in both with an unreadable quantity are not evaluable."
unit = "keys"
refresh = "at snapshot"
threshold = "any break: no materiality has been agreed (open question 5 in docs/STATUS.md)"
threshold_value = 0.0
owner = "Reconciliation lead"
decision = "Staff the break queue and investigate each key before the NAV is struck"
predicts = "Confirms a disagreement between book and custodian that needs investigating; it does not alone prove a defect (brief App. B)"
gaming = "Copying the custodian's quantity into the book clears the break without finding its cause; the quantity rebuilt from trades (section 4) still differs from both."
inputs_needed = ""

[indicators.I6]
name = "NAV rows that add up"
type = "Lagging"
status = "computed"
calculation = "100 x ledger rows where net_assets / shares_outstanding equals nav_per_share within [nav] tolerance / rows evaluable (section 7, 02_nav_check.csv). A row with a blank or unreadable input, shares_outstanding <= 0 or an unreadable as_of_date is not evaluable."
unit = "% of ledger rows"
refresh = "at snapshot"
threshold = "100% (KPI 6)"
threshold_value = 100.0
owner = "Fund accounting lead"
decision = "Hold publication of any NAV that fails"
predicts = "Confirms an arithmetic error in a struck NAV row before it reaches investors"
gaming = "Blanking shares_outstanding on a failing row makes it not evaluable instead of failing; the not_evaluable count rises."
inputs_needed = ""

[indicators.I7]
name = "NAV restatement rate"
type = "Lagging"
status = "proposed"
calculation = "corrected struck NAVs / struck NAVs, per month (brief App. B)"
unit = "% of struck NAVs"
refresh = "monthly"
threshold = "any restatement (brief App. B)"
owner = "Fund accounting lead"
decision = "Review the controls between the defect and the NAV after every restatement"
predicts = "Confirms a defect reached the investor, the most expensive discovery point (brief App. B)"
gaming = "Absorbing an error into a later period's NAV instead of restating keeps the rate at 0; the correction log against the published NAV versions would show it."
inputs_needed = "A versioned NAV history (every struck NAV and each later version) and a correction log with reasons; neither is in the extract."

[indicators.I8]
name = "Defect age to closure"
type = "Lagging"
status = "proposed"
calculation = "business days from a defect's detection to its closure, per defect, by owner"
unit = "business days"
refresh = "daily"
threshold = "open past 2 business days (scripts/framework.json operating_model: escalated to management)"
owner = "Chief Data Officer"
decision = "Escalate the owner's queue to management, and reassign or fund the fix"
predicts = "Confirms whether found defects are fixed before they reach a NAV"
gaming = "Closing a ticket and opening a new one for the same defect resets its age; the issue log would show repeat tickets on the same record ID."
inputs_needed = "An issue log with one ticket per defect: record ID, owner, opened and closed times, and the reason for closure."

